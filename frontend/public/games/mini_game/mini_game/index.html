  <script>
    let emails = [];

    let catphishY = 0;
    let catphishExpressionTimeout;

    // Performance tracking variables
    let correctAnswers = [];

    // Load emails from JSON
    fetch('emails.json')

    function startGame() {

      // Start the game
      gameRunning = true;
      updateDisplay();
      spawnEmails();
      startAirSystem();
      startMouseTracking();
      startSmoothMovement();
      startBubbleTrail();

    function spawnEmails() {
      if (!gameRunning) return;
      
      spawnInterval = setInterval(() => {

    function createEmailIcon() {
      const gameArea = document.getElementById('gameArea');
      const emailIcon = document.createElement('div');
      emailIcon.className = 'email-icon';
      
      // Random email data
      const emailData = emails[Math.floor(Math.random() * emails.length)];

            // Good - missed a phishing email
            updateScore(2);
          } else {
            // Bad - missed a legitimate email
            updateScore(-3);
            combo = 0; // Reset combo
          }
        }
      }, 6000);
    }

    function openEmail(emailData, iconElement) {
      currentEmail = { data: emailData, icon: iconElement };
      
      // Reset attachment preview tracking for new email
      currentAttachmentPreviewed = false;
      
      // Play bubble pop sound

      const emailBodyElement = document.getElementById('emailBody');

      // Add attachment if present

              <button class="attachment-btn download-btn" onclick="downloadAttachment('${emailData.attachment.name}')">📥 Download</button>
            </div>
          </div>
        `;
        emailBodyElement.innerHTML += attachmentHtml;
      }
      
      // Setup link hover previews for hidden links
      setupLinkPreviews();
      
      document.getElementById('emailModal').style.display = 'flex';
    }
    
    function playBubblePopSound() {
      try {
        const audio = new Audio('bubble-pop.mp3');
        audio.volume = 0.3; // Set volume to 30%
        audio.play().catch(e => {
          // Ignore audio play errors (browser restrictions)

        });

        // Ignore audio errors

    function playCorrectSound() {
      try {
        const audio = new Audio('happy-message-ping-351298.mp3');

        audio.play().catch(e => {
          // Ignore audio play errors (browser restrictions)
          console.log('Audio play prevented by browser');
        });
      } catch (e) {
        // Ignore audio errors
        console.log('Audio not supported');
      }
    }
    
    function playWrongSound() {
      try {
        const audio = new Audio('cat-meowing-type-02-293290.mp3');
        audio.volume = 0.5; // Set volume to 50%
        audio.play().catch(e => {
          // Ignore audio play errors (browser restrictions)
          console.log('Audio play prevented by browser');
        });
      } catch (e) {
        // Ignore audio errors
        console.log('Audio not supported');
      }
    }
    
    function setupLinkPreviews() {
      const allLinks = document.querySelectorAll('a[href]');
      allLinks.forEach(link => {
        // Prevent actual navigation
        link.addEventListener('click', handleLinkClick);
        
        // Track all link hovers (good security practice)
        link.addEventListener('mouseenter', function() {
          linkHovers++;
          showLinkPreview.call(this);
        });
        link.addEventListener('mouseleave', hideLinkPreview);
        
        // Show full URL in title for educational purposes
        const fullUrl = link.getAttribute('href');
        link.setAttribute('title', `Full URL: ${fullUrl}`);
      });
    }
    
    function showLinkPreview() {
      const link = this;
      const href = link.getAttribute('href');
      const displayText = link.textContent.trim();
      
      const preview = document.createElement('div');
      preview.className = 'link-preview';
      
      // Show both display text and actual URL for education
      if (displayText !== href) {
        preview.innerHTML = `
          <strong>Display:</strong> ${displayText}<br>
          <strong>Actual URL:</strong> ${href}<br>
          <em>⚠️ Always check where links really go!</em>
        `;
      } else {
        preview.innerHTML = `
          <strong>Link goes to:</strong> ${href}<br>
          <em>✅ Good practice checking links!</em>
        `;
      }
      
      // Position preview above the link
      const rect = link.getBoundingClientRect();
      preview.style.position = 'fixed';
      preview.style.left = rect.left + (rect.width / 2) + 'px';
      preview.style.top = (rect.top - 60) + 'px';
      preview.style.transform = 'translateX(-50%)';
      preview.style.maxWidth = '300px';
      
      document.body.appendChild(preview);
      
      // Show with animation
      setTimeout(() => preview.classList.add('show'), 10);
      
      // Store reference for cleanup
      link._preview = preview;
    }
    
    function hideLinkPreview(event) {
      const link = event.target;
      if (link._preview) {
        link._preview.remove();
        link._preview = null;
      }
    }
    
    function previewAttachment(name, type, malicious, content) {
      const modal = document.getElementById('attachmentPreview');
      const title = document.getElementById('attachmentTitle');
      const body = document.getElementById('attachmentBody');
      
      // Track attachment views
      attachmentViews++;
      currentAttachmentPreviewed = true;
      
      title.textContent = `Preview: ${name}`;
      
      let bodyContent = '';
      if (malicious) {
        bodyContent = `<div class="malicious-warning">⚠️ WARNING: This attachment appears to be malicious!</div>`;
      }
      
      bodyContent += `<div style="white-space: pre-wrap; font-family: monospace; background: #f5f5f5; padding: 15px; border-radius: 4px; border: 1px solid #ddd; color: #333; font-size: 14px; line-height: 1.4;">${content}</div>`;
      
      body.innerHTML = bodyContent;
      modal.style.display = 'flex';
    }
    
    function downloadAttachment(name) {
      // Check if attachment was previewed first
      if (!currentAttachmentPreviewed) {
        downloadWithoutPreview++;
        securityMistakes.push({
          type: 'download_without_preview',
          email: currentEmail.data,
          attachment: name,
          reason: 'Downloaded attachment without previewing - always check attachments before downloading!'
        });
      }
      
      // Show educational alert instead of actual download
      const isPhishingEmail = currentEmail && currentEmail.data.phish;
      let message = `🚨 SECURITY ALERT 🚨\n\n`;
      
      if (isPhishingEmail) {
        message += `This attachment "${name}" is from a PHISHING email and could be malicious!\n\n`;
        message += `In a real scenario, this could:\n`;
        message += `• Install malware on your computer\n`;
        message += `• Steal your personal information\n`;
        message += `• Encrypt your files (ransomware)\n\n`;
        message += `🛡️ SECURITY TIP: Always preview attachments and verify the sender before downloading!`;
      } else {
        message += `This attachment "${name}" appears to be from a legitimate email.\n\n`;
        message += `However, always remember to:\n`;
        message += `• Preview attachments before downloading\n`;
        message += `• Scan downloads with antivirus\n`;
        message += `• Verify the sender is who you expect\n\n`;
        message += `✅ This would be safe to download in a real scenario.`;
      }
      
      alert(message);
    }
    

    
    function closeAttachmentPreview() {
      document.getElementById('attachmentPreview').style.display = 'none';
    }
    
    function handleLinkClick(event) {
      event.preventDefault(); // Prevent navigation
      const link = event.target;
      const href = link.getAttribute('href');
      const isPhishingEmail = currentEmail && currentEmail.data.phish;
      
      // Track link clicks
      linkClicks++;
      
      // Check if this is a suspicious link click (security mistake)
      if (isPhishingEmail || isSuspiciousLink(href)) {
        suspiciousLinkClicks++;
        securityMistakes.push({
          type: 'suspicious_link_click',
          email: currentEmail.data,
          link: href,
          reason: 'Clicked on suspicious/malicious link - always verify links before clicking!'
        });
      }
      
      analyzeLinkClick(href, isPhishingEmail);
    }
    
    function isSuspiciousLink(href) {
      // Check for common suspicious link patterns
      const suspiciousPatterns = [
        /bit\.ly|tinyurl|t\.co|goo\.gl/, // URL shorteners
        /[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/, // IP addresses
        /[a-z0-9-]+\.(tk|ml|ga|cf)/, // Suspicious TLDs
        /[^a-zA-Z0-9.-]/, // Non-standard characters in domain
        /paypal.*secure|amazon.*verify|microsoft.*login/i, // Phishing keywords
        /urgent|verify|suspend|click.*here|act.*now/i // Urgent language
      ];
      
      return suspiciousPatterns.some(pattern => pattern.test(href));
    }
    
    function analyzeLinkClick(url, isPhishingEmail) {
      const modal = document.getElementById('linkFeedback');
      const content = document.getElementById('linkFeedbackContent');
      const icon = document.getElementById('feedbackIcon');
      const title = document.getElementById('feedbackTitle');
      const message = document.getElementById('feedbackMessage');
      const urlDiv = document.getElementById('feedbackUrl');
      
      // Reset classes
      content.className = 'link-feedback-content';
      
      // Analyze the URL for suspicious patterns
      const suspiciousPatterns = [
        /[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/, // IP addresses
        /[a-z]+-[a-z]+-[a-z]+\.(com|net|org)/, // Hyphenated domains
        /[a-z]+[0-9]+[a-z]*\.(com|net|org)/, // Numbers in domain
        /(paypal|amazon|microsoft|apple|google|facebook)-[a-z]+/, // Brand impersonation
        /[a-z]+\.(tk|ml|ga|cf)$/, // Suspicious TLDs
        /[a-z]{20,}\.(com|net|org)/, // Very long domain names
      ];
      
      const isSuspiciousUrl = suspiciousPatterns.some(pattern => pattern.test(url.toLowerCase()));
      
      // Show URL
      urlDiv.textContent = url;
      
      if (isPhishingEmail && isSuspiciousUrl) {
        // Correct identification of suspicious link in phishing email
        content.classList.add('feedback-correct');
        icon.textContent = '✅';
        title.textContent = 'Good Eye!';
        message.innerHTML = `<strong>Correct!</strong> This link is suspicious. You spotted:<br>• Suspicious domain pattern<br>• This is from a phishing email<br><br>🎯 <strong>Tip:</strong> Always hover over links to see where they really go!`;
      } else if (isPhishingEmail && !isSuspiciousUrl) {
        // Missed suspicious link in phishing email
        content.classList.add('feedback-hint');
        icon.textContent = '🤔';
        title.textContent = 'Look Closer!';
        message.innerHTML = `<strong>Hint:</strong> This email is phishing, but the link might look legitimate at first glance.<br><br>🔍 <strong>Check for:</strong><br>• Misspellings in the domain<br>• Extra words or hyphens<br>• Different top-level domains (.com vs .net)`;
      } else if (!isPhishingEmail && !isSuspiciousUrl) {
        // Legitimate link in legitimate email
        content.classList.add('feedback-correct');
        icon.textContent = '✅';
        title.textContent = 'Safe Link!';
        message.innerHTML = `<strong>Good!</strong> This appears to be a legitimate link from a trusted source.<br><br>✨ <strong>Why it's safe:</strong><br>• Matches the sender's domain<br>• No suspicious patterns<br>• From a legitimate email`;
      } else {
        // Legitimate email but user clicked anyway
        content.classList.add('feedback-hint');
        icon.textContent = '💡';
        title.textContent = 'Be Careful!';
        message.innerHTML = `<strong>Remember:</strong> Even legitimate links should be verified.<br><br>🛡️ <strong>Best practices:</strong><br>• Hover before clicking<br>• Verify the sender<br>• Check the full URL`;
      }
      
      modal.style.display = 'flex';
    }

    }

      }
      if (linkClicks > 0 && suspiciousLinkClicks === 0) {
        strengths.push('🛡️ Great judgment - you only clicked on safe links!');
      }
      if (attachmentViews > 0) {
        strengths.push('📎 Smart approach - you preview attachments before downloading!');
      }
      if (downloadWithoutPreview === 0 && attachmentViews > 0) {
        strengths.push('✅ Perfect attachment safety - always previewed before downloading!');
      }
      if (securityMistakes.length === 0) {
        strengths.push('🏆 Flawless security behavior - no risky actions taken!');
      }
      if (maxCombo >= 5) {
        strengths.push('🔥 Impressive combo streak - you\'re getting consistent!');
      }
      if (difficulty >= 3) {
        strengths.push('⚡ Handled high-pressure situations well!');
      }
      
      if (strengths.length === 0) {
        strengths.push('🌟 You completed the game - that\'s a great start!');
      }
      
      strengthsSection.innerHTML = strengths.map(strength => 
        `<div class="performance-indicator indicator-excellent">${strength}</div>`
      ).join('');
      
      // Generate improvement areas
      let improvements = [];
      if (phishingMissed > 0) {
        improvements.push('🎣 Practice identifying phishing red flags: suspicious domains, urgent language, unexpected attachments');
      }
      if (legitimateDropped > 0) {
        improvements.push('📧 Work on recognizing legitimate emails: official domains, expected content, proper formatting');
      }
      if (suspiciousLinkClicks > 0) {
        improvements.push('🚨 Avoid clicking suspicious links - hover first to check where they lead!');
      }
      if (downloadWithoutPreview > 0) {
        improvements.push('📎 Always preview attachments before downloading - this prevents malware infections!');
      }
      if (linkHovers === 0 && (linkClicks > 0 || wrongAnswers.some(w => w.email.linkType))) {
        improvements.push('🔗 Develop the habit of hovering over links to see their real destination!');
      }
      if (attachmentViews === 0 && wrongAnswers.some(w => w.email.attachment)) {
        improvements.push('📎 Always preview attachments before trusting them!');
      }
      if (accuracy < 75) {
        improvements.push('📚 Review the learning guide to strengthen your phishing detection skills');
      }
      
      if (improvements.length === 0) {
        improvements.push('🎯 You\'re doing great! Keep practicing to maintain your skills.');
      }
      
      improvementSection.innerHTML = improvements.map(improvement => 
        `<div class="performance-indicator indicator-needs-work">${improvement}</div>`
      ).join('');
      
      // Generate security mistakes section
      const securitySection = document.createElement('div');
      securitySection.className = 'report-section';
      securitySection.innerHTML = `
        <div class="section-title">🚨 Security Mistakes Review</div>
        <div id="securityMistakesContent"></div>
      `;
      
      if (securityMistakes.length > 0) {
        const mistakesHtml = securityMistakes.map(mistake => {
          let icon = '🚨';
          let title = '';
          
          switch(mistake.type) {
            case 'suspicious_link_click':
              icon = '🔗';
              title = `Clicked Suspicious Link: ${mistake.link}`;
              break;
            case 'download_without_preview':
              icon = '📎';
              title = `Downloaded Without Preview: ${mistake.attachment}`;
              break;
          }
          
          return `
            <div class="email-review wrong">
              <strong>${icon} ${title}</strong><br>
              <strong>Email:</strong> ${mistake.email.from} - ${mistake.email.subject}<br>
              <div class="email-preview">${mistake.reason}</div>
            </div>
          `;
        }).join('');
        
        securitySection.querySelector('#securityMistakesContent').innerHTML = mistakesHtml;
      } else {
        securitySection.querySelector('#securityMistakesContent').innerHTML = 
          '<p>🎉 Perfect! No security mistakes made this round.</p>';
      }
      
      // Insert security section before correct answers
      const correctSectionElement = document.querySelector('#correctSection').parentElement;
      correctSectionElement.parentElement.insertBefore(securitySection, correctSectionElement);
      
      // Generate correct answers section
      if (correctAnswers.length > 0) {
        correctSection.innerHTML = correctAnswers.map(answer => `
          <div class="email-review correct" onclick="reviewEmail('${answer.email.from}', '${answer.email.subject}', '${answer.reason}')">
            <strong>From:</strong> ${answer.email.from}<br>
            <strong>Subject:</strong> ${answer.email.subject}<br>
            <div class="email-preview">${answer.reason}</div>
          </div>
        `).join('');
      } else {
        correctSection.innerHTML = '<p>No correct answers this round. Keep practicing!</p>';
      }
      
      // Generate mistakes section
      if (wrongAnswers.length > 0) {
        mistakesSection.innerHTML = wrongAnswers.map(answer => `
          <div class="email-review wrong" onclick="reviewEmail('${answer.email.from}', '${answer.email.subject}', '${answer.reason}')">
            <strong>From:</strong> ${answer.email.from}<br>
            <strong>Subject:</strong> ${answer.email.subject}<br>
            <div class="email-preview">${answer.reason}</div>
          </div>
        `).join('');
      } else {
        mistakesSection.innerHTML = '<p>Perfect game! No mistakes made. 🎉</p>';
      }
      
      modal.style.display = 'flex';
    }
    
    function reviewEmail(from, subject, reason) {
      alert(`From: ${from}\nSubject: ${subject}\n\n${reason}\n\nTip: Click on emails during the game to see their full content and practice your analysis skills!`);
    }
    
    function closeGameReport() {
      document.getElementById('gameReport').style.display = 'none';
    }
    
    function goHome() {
      window.location.href = '/games';
    }

    function catchEmail() {
      if (!currentEmail) return;
      
      const isCorrect = !currentEmail.data.phish; // Correct if it's NOT phishing
      emailsAnswered++;
      
      if (isCorrect) {
        combo++;
        const points = 10 + (combo > 3 ? Math.floor(combo / 2) : 0);
        updateScore(points);
        showScorePopup(currentEmail.icon, `+${points}`, true);
        createParticles(currentEmail.icon, '#4CAF50');
        restoreAir(); // CatPhish gets air from correct answers!
        playCorrectSound(); // Play happy sound for correct answer
        
        // Track performance
        legitimateKept++;
        correctAnswers.push({
          email: currentEmail.data,
          action: 'caught',
          reason: 'Correctly identified as legitimate'
        });
        
        if (combo >= 5 && combo % 5 === 0) {
          showComboMessage(`${combo}x COMBO!`);
        }
      } else {
        updateScore(-5);
        showScorePopup(currentEmail.icon, '-5', false);
        createParticles(currentEmail.icon, '#f44336');
        combo = 0;
        lives--;
        showHurtExpression(); // Show hurt expression when losing life
        playWrongSound(); // Play cat meow for wrong answer
        
        // Track performance
        phishingMissed++;
        wrongAnswers.push({
          email: currentEmail.data,
          action: 'caught',
          reason: 'Missed phishing attempt - should have been dropped'
        });
        
        if (lives <= 0) {
          endGame();
        }
      }
      
      updateDifficulty();
      closeModal();
    }

    function dropEmail() {
      if (!currentEmail) return;
      
      const isCorrect = currentEmail.data.phish; // Correct if it IS phishing
      emailsAnswered++;
      
      if (isCorrect) {
        combo++;
        const points = 10 + (combo > 3 ? Math.floor(combo / 2) : 0);
        updateScore(points);
        showScorePopup(currentEmail.icon, `+${points}`, true);
        createParticles(currentEmail.icon, '#4CAF50');
        restoreAir(); // CatPhish gets air from correct answers!
        playCorrectSound(); // Play happy sound for correct answer
        
        // Track performance
        phishingCaught++;
        correctAnswers.push({
          email: currentEmail.data,
          action: 'dropped',
          reason: 'Correctly identified as phishing'
        });
        
        if (combo >= 5 && combo % 5 === 0) {
          showComboMessage(`${combo}x COMBO!`);
        }
      } else {
        updateScore(-5);
        showScorePopup(currentEmail.icon, '-5', false);
        createParticles(currentEmail.icon, '#f44336');
        combo = 0;
        lives--;
        showHurtExpression(); // Show hurt expression when losing life
        playWrongSound(); // Play cat meow for wrong answer
        
        // Track performance
        legitimateDropped++;
        wrongAnswers.push({
          email: currentEmail.data,
          action: 'dropped',
          reason: 'Incorrectly dropped legitimate email'
        });
        
        if (lives <= 0) {
          endGame();
        }
      }
      
      updateDifficulty();
      closeModal();
    }

    function closeModal() {
      if (currentEmail && currentEmail.icon) {
        currentEmail.icon.remove();
      }
      
      // Clean up any link previews
      const previews = document.querySelectorAll('.link-preview');
      previews.forEach(preview => preview.remove());
      
      document.getElementById('emailModal').style.display = 'none';
      currentEmail = null;
      updateDisplay();
    }

    function updateScore(points) {
      score += points;
      if (score < 0) score = 0;
      if (combo > maxCombo) maxCombo = combo;
    }
    
    function showScorePopup(element, text, isPositive) {
      const popup = document.createElement('div');
      popup.className = `score-popup ${isPositive ? 'positive' : 'negative'}`;
      popup.textContent = text;
      
      // Use the element's position relative to the game area
      const gameArea = document.getElementById('gameArea');
      const gameRect = gameArea.getBoundingClientRect();
      
      popup.style.left = (parseFloat(element.style.left) + 30) + 'px';
      popup.style.top = (parseFloat(element.style.top) + gameRect.top + 30) + 'px';
      
      gameArea.appendChild(popup);
      
      setTimeout(() => {
        if (popup.parentNode) {
          popup.remove();
        }
      }, 1500);
    }
    
    function createParticles(element, color) {
      const gameArea = document.getElementById('gameArea');
      const gameRect = gameArea.getBoundingClientRect();
      const centerX = parseFloat(element.style.left) + 30;
      const centerY = parseFloat(element.style.top) + 30;
      
      for (let i = 0; i < 8; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.background = color;
        particle.style.left = centerX + 'px';
        particle.style.top = centerY + 'px';
        
        const angle = (i / 8) * Math.PI * 2;
        const distance = 50 + Math.random() * 30;
        particle.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
        particle.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
        
        gameArea.appendChild(particle);
        setTimeout(() => {
          if (particle.parentNode) {
            particle.remove();
          }
        }, 1000);
      }
    }
    
    function showComboMessage(text) {
      const comboDiv = document.createElement('div');
      comboDiv.className = 'combo-display';
      comboDiv.textContent = text;
      document.body.appendChild(comboDiv);
      
      setTimeout(() => comboDiv.remove(), 2000);
    }
    
    function updateDifficulty() {
      // Increase difficulty every 10 emails
      if (emailsAnswered > 0 && emailsAnswered % 10 === 0) {
        difficulty++;
        spawnRate = Math.max(400, 1000 - (difficulty * 100)); // Faster spawning
        airDecayRate = Math.min(4, 2 + (difficulty * 0.3)); // Much faster air decay
        
        // Restart spawn interval with new rate
        clearInterval(spawnInterval);
        spawnEmails();
        
        showComboMessage(`LEVEL ${difficulty}!`);
      }
    }
    
    function startMouseTracking() {
      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });
    }
    
    function startSmoothMovement() {
      // Initialize CatPhish position
      catphishX = mouseX;
      catphishY = mouseY;
      
      // Smooth movement animation loop
      function smoothMove() {
        if (gameRunning) {
          // Smooth dragging effect - CatPhish follows with delay
          const dragFactor = 0.08; // Lower = more dragging
          const targetX = mouseX + 25; // Position closer to the right of mouse
          const targetY = mouseY - 15; // Closer to mouse level
          
          catphishX += (targetX - catphishX) * dragFactor;
          catphishY += (targetY - catphishY) * dragFactor;
          
          updateCatphishPosition();
          requestAnimationFrame(smoothMove);
        }
      }
      smoothMove();
    }
    
    function updateCatphishPosition() {
      const catphish = document.getElementById('catphish');
      if (catphish) {
        catphish.style.left = catphishX + 'px';
        catphish.style.top = catphishY + 'px';
      }
    }
    
    function startBubbleTrail() {
      bubbleTrailInterval = setInterval(() => {
        if (gameRunning && airLevel > 0) {
          createBubbleTrail();
        }
      }, 200); // Create bubble every 200ms
    }
    
    function createBubbleTrail() {
      const bubble = document.createElement('div');
      bubble.className = 'bubble-trail';
      
      // Position bubble to the right of CatPhish with some randomness
      const offsetX = Math.random() * 15; // Only positive offset to the right
      const offsetY = (Math.random() - 0.5) * 20;
      
      bubble.style.left = (catphishX + 50 + offsetX) + 'px'; // Adjusted for closer position
      bubble.style.top = (catphishY + 20 + offsetY) + 'px';
      
      document.body.appendChild(bubble);
      
      // Remove bubble after animation
      setTimeout(() => {
        if (bubble.parentNode) {
          bubble.remove();
        }
      }, 2000);
    }
    
    function startAirSystem() {
      airDecayInterval = setInterval(() => {
        if (gameRunning) {
          airLevel -= airDecayRate;
          if (airLevel < 0) airLevel = 0;
          
          updateAirMeter();
          updateCatphishExpression();
          
          // Lose life if air runs out
          if (airLevel <= 0) {
            lives--;
            airLevel = 50; // Give some air back
            showHurtExpression(); // Show hurt expression when losing life to air
            if (lives <= 0) {
              endGame();
            } else {
              updateDisplay();
            }
          }
        }
      }, 1000); // Every second
    }
    
    function updateAirMeter() {
      const airFill = document.getElementById('airFill');
      if (airFill) {
        airFill.style.height = airLevel + '%';
        
        // Update visual state
        airFill.className = 'air-meter-fill';
        if (airLevel <= 20) {
          airFill.classList.add('critical');
        } else if (airLevel <= 40) {
          airFill.classList.add('low');
        }
      }
    }
    
    function updateCatphishExpression() {
      const catphishImg = document.getElementById('catphishImg');
      if (!catphishImg) return;
      
      if (airLevel <= 20) {
        catphishImg.src = 'catphish-character-scared.png';
        // Show warning if not already shown
        if (!airWarningShown) {
          showAirWarning();
        }
      } else {
        catphishImg.src = 'catphish-character-emoji.png';
        // Hide warning if air level is good
        if (airWarningShown) {
          hideAirWarning();
        }
      }
    }
    
    function showAirWarning() {
      if (currentAirWarning) return; // Don't show multiple warnings
      
      airWarningShown = true;
      const warning = document.createElement('div');
      warning.className = 'air-warning';
      warning.innerHTML = '⚠️ CatPhish is running out of air!<br>📧 Collect email bubbles to restore air!';
      
      document.body.appendChild(warning);
      currentAirWarning = warning;
      
      // Auto-hide after 3 seconds
      setTimeout(() => {
        hideAirWarning();
      }, 3000);
    }
    
    function hideAirWarning() {
      if (currentAirWarning) {
        currentAirWarning.classList.add('fade-out');
        setTimeout(() => {
          if (currentAirWarning && currentAirWarning.parentNode) {
            currentAirWarning.remove();
          }
          currentAirWarning = null;
          airWarningShown = false;
        }, 500);
      }
    }
    
    function showHurtExpression() {
      const catphishImg = document.getElementById('catphishImg');
      if (!catphishImg) return;
      
      // Clear any existing timeout
      if (catphishExpressionTimeout) {
        clearTimeout(catphishExpressionTimeout);
      }
      
      // Show hurt expression
      catphishImg.src = 'catphish-character-hurt.png';
      
      // Reset to normal expression after 1.5 seconds
      catphishExpressionTimeout = setTimeout(() => {
        catphishImg.src = 'catphish-character-emoji.png';
      }, 1500);
    }
    
    function restoreAir() {
      airLevel = Math.min(100, airLevel + 25); // Restore 25 air points
      updateAirMeter();
      updateCatphishExpression();
      
      // Make CatPhish jump and show happy expression
      const catphish = document.getElementById('catphish');
      const catphishImg = document.getElementById('catphishImg');
      
      if (catphish && catphishImg) {
        catphish.classList.add('jumping');
        catphishImg.src = 'catphish-character-very-happy0.png';
        
        // Clear any existing timeout
        if (catphishExpressionTimeout) {
          clearTimeout(catphishExpressionTimeout);
        }
        
        // Reset expression after animation (longer duration for happiness)
        catphishExpressionTimeout = setTimeout(() => {
          catphishImg.src = 'catphish-character-emoji.png';
          catphish.classList.remove('jumping');
        }, 2500); // Extended to 2.5 seconds
      }
    }

    function updateDisplay() {
      document.getElementById('score').textContent = score;
      
      // Update hearts display
      const hearts = document.querySelectorAll('.heart');
      hearts.forEach((heart, index) => {
        if (index < lives) {
          heart.style.opacity = '1';
          heart.style.transform = 'scale(1)';
        } else {
          heart.style.opacity = '0.3';
          heart.style.transform = 'scale(0.8)';
          heart.style.filter = 'grayscale(100%)';
        }
      });
    }

    function endGame() {
      gameRunning = false;
      clearInterval(spawnInterval);
      if (airDecayInterval) {
        clearInterval(airDecayInterval);
      }
      if (bubbleTrailInterval) {
        clearInterval(bubbleTrailInterval);
      }
      
      // Show detailed performance report
      showGameReport();
    }

    function restartGame() {
      score = 0;
      lives = 3;
      gameRunning = false;
      currentEmail = null;
      combo = 0;
      maxCombo = 0;
      difficulty = 1;
      emailsAnswered = 0;
      spawnRate = 1000;
      airLevel = 100;
      airDecayRate = 2; // Updated base rate
      
      // Reset performance tracking
      correctAnswers = [];
      wrongAnswers = [];
      phishingCaught = 0;
      phishingMissed = 0;
      legitimateKept = 0;
      legitimateDropped = 0;
      linkClicks = 0;
      attachmentViews = 0;
      linkHovers = 0;
      suspiciousLinkClicks = 0;
      downloadWithoutPreview = 0;
      securityMistakes = [];
      currentAttachmentPreviewed = false;
      
      // Clear all email icons
      const gameArea = document.getElementById('gameArea');
      gameArea.innerHTML = '';
      
      // Clear intervals
      if (spawnInterval) {
        clearInterval(spawnInterval);
      }
      if (airDecayInterval) {
        clearInterval(airDecayInterval);
      }
      if (catphishExpressionTimeout) {
        clearTimeout(catphishExpressionTimeout);
      }
      if (bubbleTrailInterval) {
        clearInterval(bubbleTrailInterval);
      }
      
      // Reset warning state
      airWarningShown = false;
      if (currentAirWarning) {
        currentAirWarning.remove();
        currentAirWarning = null;
      }
      
      // Hide game and show welcome screen
      document.getElementById('gameContainer').style.display = 'none';
      document.getElementById('gameOver').style.display = 'none';
      document.getElementById('emailModal').style.display = 'none';
      document.getElementById('gameReport').style.display = 'none';
      document.getElementById('welcomeScreen').style.display = 'flex';
      
      // Reset hearts display
      const hearts = document.querySelectorAll('.heart');
      hearts.forEach(heart => {
        heart.style.opacity = '1';
        heart.style.transform = 'scale(1)';
        heart.style.filter = 'none';
      });
    }

    function goHome() {
      window.location.href = '/';
    }
    
    function goToLearn() {
      window.location.href = 'learn.html';
    }

    // Close modal when clicking outside
    document.getElementById('emailModal').onclick = function(e) {
      if (e.target === this) {
        closeModal();
      }
    };
  </script>
</body>
</html>
