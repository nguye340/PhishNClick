name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to deployment directory
            cd /opt/phishnclick
            
            # Fix ownership
            sudo chown -R ubuntu:ubuntu /opt/phishnclick
            
            # Pull latest code
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/main
              git clean -fd
            else
              # Backup env files
              cp backend.env /tmp/backend.env.bak 2>/dev/null || true
              cp frontend.env /tmp/frontend.env.bak 2>/dev/null || true
              
              # Clean directory completely
              rm -rf /opt/phishnclick/*
              rm -rf /opt/phishnclick/.git
              cd /opt/phishnclick
              
              # Clone repo
              git clone https://github.com/${{ github.repository }} .
              
              # Restore env files
              cp /tmp/backend.env.bak backend.env 2>/dev/null || true
              cp /tmp/frontend.env.bak frontend.env 2>/dev/null || true
            fi
            
            # Stop existing containers
            docker compose -f docker-compose.prod.yml down || true
            
            # Rebuild and start containers
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d
            
            # Clean up old images
            docker image prune -f
            
            # Show running containers
            docker compose -f docker-compose.prod.yml ps
